<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter - 50 Levels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>

    <!-- Panel Auth (Login & Register) -->
    <div class="card-container" id="auth-card">
        <div class="logo">👻</div>
        <h1 class="title">GHOST HUNTER</h1>
        <p class="subtitle">Hunt the ghosts. Survive 50 levels!</p>

        <!-- Form Login -->
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Username" required autocomplete="off">
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary" id="btn-login">LOGIN</button>
            <button type="button" class="btn btn-secondary" onclick="switchForm('register')">DAFTAR AKUN</button>
        </form>

        <!-- Form Register -->
        <form id="register-form" class="hidden">
            <input type="text" id="reg-username" placeholder="Username Baru" required autocomplete="off">
            <input type="password" id="reg-password" placeholder="Password Baru" required>
            <button type="submit" class="btn btn-primary" id="btn-register">DAFTAR</button>
            <button type="button" class="btn btn-secondary" onclick="switchForm('login')">KEMBALI KE LOGIN</button>
        </form>

        <div id="auth-message" class="message"></div>
        <div class="footer-credit">Design by Firman XI RPL</div>
    </div>

    <!-- Panel Menu Utama & Leaderboard -->
    <div class="card-container hidden" id="dashboard-card">
        <div class="logo">👻</div>
        <h1 class="title">LEADERBOARD</h1>
        <p class="subtitle" id="welcome-msg">Selamat datang, Hunter!</p>

        <div class="leaderboard-table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>High Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="btn btn-primary" onclick="startGame()">MULAIMAIN (LEVEL 1-50)</button>
        <button class="btn btn-secondary" onclick="logout()" style="margin-top: 10px;">LOGOUT</button>
        <div class="footer-credit">Design by Firman XI RPL</div>
    </div>

    <!-- Area Permainan Game (50 Level) -->
    <div class="card-container game-card hidden" id="game-card">
        <div class="game-header">
            <div>Level: <span id="game-level">1</span>/50</div>
            <div>Score: <span id="game-score">0</span></div>
            <div class="lives-container">Nyawa: <span id="game-lives">❤️❤️❤️❤️❤️</span></div>
        </div>
        <div class="game-info">
            <span id="target-info">Tangkap 3 hantu!</span> | Waktu: <span id="game-timer">10</span>s
        </div>

        <!-- Arena Tempat Hantu Muncul -->
        <div class="game-arena" id="game-arena">
            <!-- Hantu dan rintangan akan di-generate via JS -->
        </div>

        <button class="btn btn-secondary" onclick="exitGame()" style="margin-top: 15px;">MENYERAH</button>
        <div class="footer-credit">Design by Firman XI RPL</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
